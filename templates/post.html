<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>{{ post.titulo }}</title>
</head>
<body>
  <h1>{{ post.titulo }}</h1>
  <p>{{ post.conteudo }}</p>

  <hr>

  <h2>Comentários</h2>
  {% if post.comentarios %}
    <ul>
      {% for c in post.comentarios %}
        <li><strong>{{ c.autor }}</strong>: {{ c.texto }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Sem comentários ainda.</p>
  {% endif %}

  <hr>

  <h3>Deixe um comentário</h3>
  <form method="post">
    <label>Nome:</label><br>
    <input type="text" name="autor" required><br><br>

    <label>Comentário:</label><br>
    <textarea name="comentario" rows="4" cols="50" required></textarea><br><br>

    <button type="submit">Enviar</button>
  </form>

  <p><a href="/">Voltar</a></p>
</body>
</html>
