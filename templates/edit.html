<!DOCTYPE html>
<html>
<head>
<title>Editar Post</title>
</head>
<body>
{% extends 'base.html' %}
{% block title %}Título da Página{% endblock %}
{% block content %}
    <h1>Editar Post</h1>
    <form method="POST" enctype="multipart/form-data">
        <label for="titulo">Título:</label><br>
        <input type="text" name="titulo" value="{{ post.titulo }}" required><br><br>

        <label for="imagem">Imagem Atual:</label><br>
        <img src="{{ url_for('static', filename=post.imagem) }}" alt="Imagem do post" width="200"><br><br>

        <label for="imagem">Alterar Imagem:</label><br>
        <input type="file" name="imagem" accept="image/*"><br><br>

        <label for="conteudo">Conteúdo:</label><br>
        <textarea name="conteudo" rows="5" cols="40" required>{{ post.conteudo }}</textarea><br><br>

        <button type="submit">Atualizar</button>
    </form>
    <br>
    <a href="{{ url_for('index') }}">Voltar</a>
{% endblock %}
</body>
</html>
